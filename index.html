<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>텍스트 PDF 변환기</title>
<meta name="description" content="글을 붙여넣고 간편하게 PDF로 저장하세요.">
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="텍스트를 PDF로">
<meta property="og:description" content="글을 붙여넣고 간편하게 PDF로 저장하세요.">
<meta property="og:url" content="https://hadangs516.github.io/text-to-pdf-converter/">
<meta property="og:image" content="https://hadangs516.github.io/text-to-pdf-converter/og-image.jpg">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="314">

<style>
  :root {
    color-scheme: light;
    --bg: #f1f5f8;
    --surface: #ffffff;
    --ink: #121a21;
    --muted: #5f6b76;
    --line: #d5dde4;
    --soft: #eaeff3;
    --accent: #12716c;
    --accent-ink: #ffffff;
    --accent-off: #8db4b1;
    --art-line: #c8d3dd;
    --error: #b3261e;
    --shadow: 0 1px 2px rgba(18, 26, 33, 0.05), 0 6px 18px rgba(18, 26, 33, 0.05);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e1215;
      --surface: #171d22;
      --ink: #e9edf0;
      --muted: #98a3ac;
      --line: #2c353c;
      --soft: #212a31;
      --accent: #5cc8c0;
      --accent-ink: #062321;
      --accent-off: #35625f;
      --art-line: #3a4650;
      --error: #f2877f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1215;
    --surface: #171d22;
    --ink: #e9edf0;
    --muted: #98a3ac;
    --line: #2c353c;
    --soft: #212a31;
    --accent: #5cc8c0;
    --accent-ink: #062321;
    --accent-off: #35625f;
    --art-line: #3a4650;
    --error: #f2877f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Nanum Gothic", sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 600px; margin: 0 auto; padding: 22px 12px 32px; }

  .ico { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* header */
  .hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 0 8px 20px; }
  .hero-text { min-width: 0; }
  h1 { margin: 4px 0 8px; font-size: clamp(25px, 7.2vw, 34px); line-height: 1.2; font-weight: 800; letter-spacing: -0.03em; }
  .lead { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
  .hero-art { width: 84px; height: auto; flex: none; margin-top: 2px; filter: drop-shadow(0 4px 10px rgba(18, 26, 33, 0.10)); }

  /* cards */
  .card { background: var(--surface); border-radius: 20px; padding: 16px 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .card-title { display: block; margin: 0; padding: 0 2px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .card > .card-title { margin-bottom: 12px; }
  .card-head .card-title { margin-bottom: 0; }

  textarea, input[type="text"], select { font: inherit; font-size: 16px; color: var(--ink); }
  textarea {
    display: block; width: 100%; min-height: 40vh; min-height: 40dvh; margin: 0; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    line-height: 1.6; resize: vertical;
  }
  textarea::placeholder, input::placeholder { color: var(--muted); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stat { display: flex; align-items: center; gap: 12px; padding: 2px 8px; min-width: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .ico { font-size: 28px; color: var(--accent); }
  .stat-val { font-size: 19px; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; }
  .stat-val small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .stat-label { font-size: 13px; color: var(--muted); line-height: 1.35; }

  .name-box { display: flex; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .name-box input { flex: 1; min-width: 0; height: 52px; padding: 0 16px; background: transparent; border: 0; }
  .ext { display: flex; align-items: center; padding: 0 16px; background: var(--soft); color: var(--muted); font-size: 16px; }

  /* settings */
  .pills { display: grid; grid-template-columns: 0.8fr 1.1fr 1.1fr; gap: 8px; }
  .pill { position: relative; display: block; min-width: 0; }
  .pill select {
    display: block; width: 100%; height: 50px; margin: 0; padding: 0 26px 0 36px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 25px;
    font-weight: 600; letter-spacing: -0.02em; text-overflow: ellipsis;
    -webkit-appearance: none; appearance: none;
  }
  .pill .lead-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--accent); pointer-events: none; }
  .pill .chev { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--ink); pointer-events: none; }
  @media (max-width: 380px) {
    .pill select { padding-left: 14px; }
    .pill .lead-ico { display: none; }
  }

  .primary {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 58px; margin: 0; padding: 0 16px;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 16px;
    font: inherit; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; cursor: pointer;
    box-shadow: 0 8px 18px rgba(18, 113, 108, 0.25);
  }
  .primary .ico { font-size: 24px; }
  .primary:disabled { background: var(--accent-off); box-shadow: none; cursor: default; }

  textarea:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .name-box:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .name-box input:focus-visible { outline: none; }

  .status { min-height: 1.5em; margin: 12px 4px 0; font-size: 14px; color: var(--muted); }
  .status.error { color: var(--error); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6.5 3h7.2l4.8 4.8V20a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M13.5 3v5h5"/><path d="M9 13h6M9 16.5h6"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z"/><path d="M3.5 12.2l8.5 4.5 8.5-4.5"/><path d="M3.5 16.2l8.5 4.5 8.5-4.5"/></symbol>
  <symbol id="i-frame" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><rect x="6" y="3" width="10" height="14" rx="1.5"/><path d="M13 21h6m-2-2l2 2-2 2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
</svg>

<main>
  <header class="hero">
    <div class="hero-text">
      <h1>텍스트를 PDF로</h1>
      <p class="lead">글을 입력하고 설정을 선택하면 <span id="leadPaper">A4</span> PDF 파일이 만들어집니다.</p>
    </div>
    <svg class="hero-art" viewBox="0 0 120 130" aria-hidden="true">
      <path d="M14 8h62l26 26v78a6 6 0 0 1-6 6H20a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6z" fill="var(--surface)"/>
      <path d="M76 8l26 26H82a6 6 0 0 1-6-6z" fill="var(--soft)"/>
      <rect x="28" y="40" width="34" height="8" rx="4" fill="var(--art-line)"/>
      <rect x="28" y="58" width="58" height="8" rx="4" fill="var(--art-line)"/>
      <rect x="28" y="76" width="58" height="8" rx="4" fill="var(--art-line)"/>
      <rect x="28" y="94" width="28" height="8" rx="4" fill="var(--art-line)"/>
      <rect x="60" y="88" width="56" height="30" rx="7" fill="var(--accent)"/>
      <text x="88" y="109" text-anchor="middle" font-size="19" font-weight="800" fill="var(--accent-ink)" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">PDF</text>
    </svg>
  </header>

  <section class="card">
    <div class="card-head">
      <label class="card-title" for="text">내용</label>
    </div>
    <textarea id="text" placeholder="여기에 텍스트를 붙여넣거나 입력하세요." autocomplete="off" spellcheck="false"></textarea>
    <div class="stats">
      <div class="stat">
        <svg class="ico" aria-hidden="true"><use href="#i-doc"/></svg>
        <div>
          <div class="stat-val" id="chars">0자</div>
          <div class="stat-label">현재 글자 수</div>
        </div>
      </div>
      <div class="stat">
        <svg class="ico" aria-hidden="true"><use href="#i-layers"/></svg>
        <div>
          <div class="stat-val"><span id="pages">0페이지</span> <small>(예상)</small></div>
          <div class="stat-label" id="basis">A4, 기본 여백 기준</div>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <label class="card-title" for="name">파일 이름</label>
    <div class="name-box">
      <input type="text" id="name" placeholder="문서" autocomplete="off" maxlength="80">
      <span class="ext">.pdf</span>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title">PDF 설정</h2>
    <div class="pills">
      <label class="pill">
        <svg class="ico lead-ico" aria-hidden="true"><use href="#i-doc"/></svg>
        <select id="paper" aria-label="용지 크기">
          <option value="A4" selected>A4</option>
          <option value="A5">A5</option>
          <option value="B5">B5</option>
        </select>
        <svg class="ico chev" aria-hidden="true"><use href="#i-chev"/></svg>
      </label>
      <label class="pill">
        <svg class="ico lead-ico" aria-hidden="true"><use href="#i-frame"/></svg>
        <select id="margin" aria-label="여백">
          <option value="narrow">여백 좁게</option>
          <option value="normal" selected>여백 기본</option>
          <option value="wide">여백 넓게</option>
        </select>
        <svg class="ico chev" aria-hidden="true"><use href="#i-chev"/></svg>
      </label>
      <label class="pill">
        <svg class="ico lead-ico" aria-hidden="true"><use href="#i-rotate"/></svg>
        <select id="orient" aria-label="용지 방향">
          <option value="portrait" selected>세로 방향</option>
          <option value="landscape">가로 방향</option>
        </select>
        <svg class="ico chev" aria-hidden="true"><use href="#i-chev"/></svg>
      </label>
    </div>
  </section>

  <button type="button" class="primary" id="go">
    <svg class="ico" aria-hidden="true"><use href="#i-doc"/></svg>
    <span>PDF로 저장</span>
  </button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  var DPI = 200;
  var FONT_PX = 31;
  var LINE_H = 50;
  var FONT = FONT_PX + 'px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Nanum Gothic",sans-serif';
  var PAPERS = { A4: [210, 297], A5: [148, 210], B5: [176, 250] };
  var MARGINS = { narrow: { mm: 15, name: '좁은' }, normal: { mm: 25, name: '기본' }, wide: { mm: 35, name: '넓은' } };
  var $text = document.getElementById('text');
  var $chars = document.getElementById('chars');
  var $pages = document.getElementById('pages');
  var $basis = document.getElementById('basis');
  var $lead = document.getElementById('leadPaper');
  var $name = document.getElementById('name');
  var $paper = document.getElementById('paper');
  var $margin = document.getElementById('margin');
  var $orient = document.getElementById('orient');
  var $go = document.getElementById('go');
  var $status = document.getElementById('status');

  var measureCtx = document.createElement('canvas').getContext('2d');

  function setStatus(msg, isError) {
    $status.textContent = msg || '';
    $status.className = 'status' + (isError ? ' error' : '');
  }

  function mmToPx(mm) { return Math.round(mm / 25.4 * DPI); }

  function dims() {
    var p = PAPERS[$paper.value] || PAPERS.A4;
    var w = p[0], h = p[1];
    if ($orient.value === 'landscape') { var t = w; w = h; h = t; }
    var W = mmToPx(w), H = mmToPx(h);
    var M = mmToPx((MARGINS[$margin.value] || MARGINS.normal).mm);
    return { wmm: w, hmm: h, W: W, H: H, M: M, maxW: W - 2 * M, lines: Math.max(1, Math.floor((H - 2 * M) / LINE_H)) };
  }

  function wrapLines(text, ctx, maxW) {
    var out = [];
    var paras = text.replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
    function fits(s) { return ctx.measureText(s.replace(/\s+$/, '')).width <= maxW; }

    paras.forEach(function (p) {
      if (p.trim() === '') { out.push(''); return; }
      var tokens = p.match(/\S+\s*|\s+/g) || [];
      var line = '';
      tokens.forEach(function (tok) {
        var test = line + tok;
        if (fits(test)) { line = test; return; }
        if (line.trim() !== '') out.push(line.replace(/\s+$/, ''));
        line = '';
        if (fits(tok)) { line = tok; return; }
        Array.from(tok).forEach(function (ch) {
          if (line !== '' && !fits(line + ch)) { out.push(line.replace(/\s+$/, '')); line = ''; }
          line += ch;
        });
      });
      out.push(line.replace(/\s+$/, ''));
    });
    return out;
  }

  function paginate(lines, perPage) {
    var pages = [];
    var cur = [];
    lines.forEach(function (l) {
      if (cur.length === 0 && pages.length > 0 && l === '') return;
      cur.push(l);
      if (cur.length === perPage) { pages.push(cur); cur = []; }
    });
    if (cur.length) pages.push(cur);
    return pages;
  }

  function layout(text, ctx, d) {
    ctx.font = FONT;
    return paginate(wrapLines(text, ctx, d.maxW), d.lines);
  }

  /* live stats */
  function updateChars() {
    var n = Array.from($text.value.replace(/\n/g, '')).length;
    $chars.textContent = n.toLocaleString('ko-KR') + '자';
  }
  function updateBasis() {
    var m = MARGINS[$margin.value] || MARGINS.normal;
    $basis.textContent = $paper.value + ', ' + m.name + ' 여백 기준';
    $lead.textContent = $paper.value;
  }
  function updatePages() {
    var text = $text.value;
    var n = 0;
    if (text.trim() !== '') n = layout(text, measureCtx, dims()).length;
    $pages.textContent = n.toLocaleString('ko-KR') + '페이지';
  }
  var timer = null;
  function schedulePages() { clearTimeout(timer); timer = setTimeout(updatePages, 200); }

  $text.addEventListener('input', function () { updateChars(); schedulePages(); });
  [$paper, $margin, $orient].forEach(function (el) {
    el.addEventListener('change', function () { updateBasis(); schedulePages(); });
  });

  /* export */
  function nextFrame() { return new Promise(function (r) { setTimeout(r, 0); }); }

  function cleanName(raw) {
    var n = (raw || '').replace(/[\\\/:*?"<>|]/g, '').replace(/\.pdf$/i, '').trim();
    return (n || '문서') + '.pdf';
  }

  async function saveFile(doc, filename) {
    var dl = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        dl = await window.claude.use('downloads');
      }
    } catch (e) { dl = null; }

    if (dl) {
      try {
        await dl.save({ filename: filename, data: doc.output('arraybuffer') });
        setStatus('저장했습니다: ' + filename);
      } catch (e) {
        if (e && e.code === 'declined') setStatus('저장을 취소했습니다.');
        else setStatus('저장하지 못했습니다. 다시 시도해 주세요.', true);
      }
    } else {
      doc.save(filename);
      setStatus('저장했습니다: ' + filename);
    }
  }

  async function convert() {
    var text = $text.value;
    if (text.trim() === '') { setStatus('내용을 먼저 입력해 주세요.', true); $text.focus(); return; }
    if (!window.jspdf || !window.jspdf.jsPDF) {
      setStatus('PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.', true);
      return;
    }

    $go.disabled = true;
    setStatus('변환 중입니다.');
    try {
      var d = dims();
      var canvas = document.createElement('canvas');
      canvas.width = d.W; canvas.height = d.H;
      var ctx = canvas.getContext('2d');

      var pages = layout(text, ctx, d);
      var doc = new window.jspdf.jsPDF({
        unit: 'mm', format: [d.wmm, d.hmm],
        orientation: d.wmm > d.hmm ? 'landscape' : 'portrait'
      });
      var offset = Math.round((LINE_H - FONT_PX) / 2);

      for (var i = 0; i < pages.length; i++) {
        setStatus('변환 중입니다. ' + (i + 1) + ' / ' + pages.length + '쪽');
        await nextFrame();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, d.W, d.H);
        ctx.fillStyle = '#111111';
        ctx.font = FONT;
        ctx.textBaseline = 'top';
        pages[i].forEach(function (l, idx) {
          if (l !== '') ctx.fillText(l, d.M, d.M + idx * LINE_H + offset);
        });

        if (i > 0) doc.addPage();
        doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, d.wmm, d.hmm, undefined, 'FAST');
      }

      await saveFile(doc, cleanName($name.value));
    } catch (e) {
      setStatus('변환 중 오류가 생겼습니다. 내용을 줄여서 다시 시도해 주세요.', true);
    } finally {
      $go.disabled = false;
    }
  }

  $go.addEventListener('click', convert);
  updateChars();
  updateBasis();
})();
</script>
</body>
</html>
